# ========================================================
# Apache Shiro Security Configuration for Fuseki Standalone
# ========================================================

[main]
# Development security policy
ssl.enabled = false

plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

localhostFilter = org.apache.jena.fuseki.authz.LocalhostFilter

[users]
# Default admin user credentials for local management (change in production)
admin=adminpassword

[roles]
admin=*

[urls]
# Control access to Fuseki administration
/$/** = localhostFilter

# Public SPARQL read query endpoint for local application
/mk_nexus/query = anon
/mk_nexus/sparql = anon
/mk_nexus/get = anon

# Write/Update operations can be restricted or open for local dev
/mk_nexus/update = authcBasic,roles[admin]
/mk_nexus/upload = authcBasic,roles[admin]
/mk_nexus/data = authcBasic,roles[admin]

/** = anon
